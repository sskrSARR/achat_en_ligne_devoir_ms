# ===========================
# SERVER
# ===========================
server.port=9090

# ===========================
# APPLICATION
# ===========================
spring.application.name=achat-en-ligne-ms

# ===========================
# DATASOURCE - MySQL
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/achat_en_ligne_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / HIBERNATE
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===========================
# CACHE
# ===========================
spring.cache.type=simple

# ===========================
# KEYCLOAK / OAuth2 Resource Server
# Keycloak tourne sur le port 8080
# ===========================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/achat-en-ligne
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/achat-en-ligne/protocol/openid-connect/certs

# ===========================
# KEYCLOAK (config custom)
# ===========================
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=achat-en-ligne
keycloak.resource=achat-en-ligne-client
keycloak.public-client=true

# ===========================
# SPRINGDOC / SWAGGER
# ===========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.oauth2-redirect-url=http://localhost:9090/swagger-ui/oauth2-redirect.html
springdoc.swagger-ui.oauth.client-id=achat-en-ligne-client
springdoc.swagger-ui.oauth.realm=achat-en-ligne
springdoc.swagger-ui.oauth.app-name=achat-en-ligne-ms

# ===========================
# LOGGING
# ===========================
logging.level.com.groupeisi.company=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/achat-en-ligne-ms.log

# ===========================
# ACTUATOR
# ===========================
management.endpoints.web.exposure.include=health,info,metrics
